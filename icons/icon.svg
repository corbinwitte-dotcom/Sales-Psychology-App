    <path d="M 220 340 Q 210 320, 200 340" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 292 340 Q 302 320, 312 340" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 190 340 Q 175 310, 160 340" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 322 340 Q 337 310, 352 340" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">PEAK</text>
</svg>
